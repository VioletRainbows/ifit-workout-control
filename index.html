<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iFit Workout Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" integrity="sha256-dEAdc43T4D7l37O2hBIQ/ixOrYqWDEARykugt4qf2PM=" crossorigin="anonymous"></script>
  <style type="text/css">
    .chart-container {
      height: 36rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="text-center mt-2 mb-4">iFit Workout Control</h1>
    <h2 class="text-center mb-4">HIIT Workouts</h2>
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <h5 class="card-header">HIIT Workouts</h5>
            <div class="card-body d-flex justify-content-evenly flex-wrap">
              <button class="btn btn-primary m-2" onclick="selectHIITWorkout('beginner')">Beginner</button>
              <button class="btn btn-primary m-2" onclick="selectHIITWorkout('intermediate')">Intermediate</button>
              <button class="btn btn-primary m-2" onclick="selectHIITWorkout('advanced')">Advanced</button>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-12">
          <div class="card" id="hiitSettings" hidden>
            <h5 class="card-header">Workout Settings</h5>
            <div class="card-body">
              <div class="d-flex flex-wrap justify-content-around">
                <div class="form-floating m-1">
                  <input type="number" class="form-control" id="hiitWorkSpeed" step="0.5" min="0">
                  <label for="hiitWorkSpeed">Sprint Speed</label>
                </div>
                <div class="form-floating m-1">
                  <input type="number" class="form-control" id="hiitWorkIncline" step="0.5" min="1">
                  <label for="hiitWorkIncline">Sprint Incline</label>
                </div>
                <div class="form-floating m-1">
                  <input type="number" class="form-control" id="hiitSets" step="1" min="1">
                  <label for="hiitSets">Sets</label>
                </div>
                <div class="form-floating m-1">
                  <input type="number" class="form-control" id="hiitRunTime" step="0.5" min="0.5">
                  <label for="hiitRunTime">Set Running Time (min)</label>
                </div>
                <div class="form-floating m-1">
                  <input type="number" class="form-control" id="hiitWalkTime" step="0.5" min="0.5">
                  <label for="hiitWalkTime">Set Walking Time (min)</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-5">
        <div class="w-100 chart-container">
          <canvas class="h-100 w-100" id="workoutChart"></canvas>
        </div>
      </div>
      <div class="row mt-3 mb-5">
        <div class="col-12 w-100 d-flex justify-content-around">
          <button class="btn btn-lg btn-success" onclick="startWorkout()">Start</button>
          <button class="btn btn-lg btn-danger" onclick="stopWorkout()">Stop</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
